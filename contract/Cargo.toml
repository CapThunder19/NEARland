[package]
name = "nearland-market"
version = "0.1.0"
edition = "2021"
description = "NEARland on-chain item balances and escrowed player-to-player market"
license = "MIT"
repository = "https://github.com/CapThunder19/NEARland"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
